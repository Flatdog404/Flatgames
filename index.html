<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>new tab — flatgames</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Theme dropdown - fixed in top right -->
  <div class="theme-selector" id="themeSelector">
    <button class="theme-button" type="button" aria-expanded="false" aria-controls="themeOptions">
      <span id="themeName">Default</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div class="theme-options" id="themeOptions"></div>
  </div>

  <!-- Header with title and notes -->
  <header class="main-header">
    <h1><span class="accent-text">flatgames</span></h1>
    <p>simple, portable, and unblockable game website.</p>
  </header>

  <!-- Main layout: side-by-side sections -->
  <main class="container">
    
    <!-- FlatApps section (left sidebar) -->
    <section id="appsSection" class="apps-section">
      <h2>flatapps</h2>
      <a href="/flatchat" class="app-link">flatchat</a>
    </section>

    <!-- Games/Apps Section (right side — takes most of the screen) -->
    <section id="gamesSection" class="games-section">
      <h2>games &amp; apps</h2>
      <div id="gameGrid" class="game-grid"></div>
    </section>

  </main>

  <script src="themes-loader.js"></script>

  <!-- Dynamically load games from /Apps/ folder -->
  <script src="apps-loader.js"></script>

</body>
</html>
