<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
</head>
<body>
    <div id="messages" style="white-space: pre-wrap;">Loading messages...</div>
    <input type="text" id="messageInput" placeholder="Type a message...">

    <script>
        const STORAGE_KEY = 'flatgames-display-name'

        function readStoredName() {
            try {
                return localStorage.getItem(STORAGE_KEY) || ''
            } catch (error) {
                console.warn('Unable to read saved display name:', error)
                return ''
            }
        }

        function saveStoredName(name) {
            const cleanName = (name || '').trim()
            try {
                if (cleanName) {
                    localStorage.setItem(STORAGE_KEY, cleanName)
                } else {
                    localStorage.removeItem(STORAGE_KEY)
                }
            } catch (error) {
                console.warn('Unable to save display name:', error)
            }
        }

        const savedName = readStoredName()
        const displayName = savedName || prompt('Enter display name:') || ''
        if (displayName) {
            saveStoredName(displayName)
        }

        async function updateMessages() {
            try {
                const res = await fetch('/api/messages', { cache: 'no-store' })
                if (!res.ok) throw new Error('Failed to load messages')
                const textData = await res.text()
                document.getElementById('messages').textContent = textData || 'No messages yet.'
            } catch (error) {
                console.error('Error fetching messages:', error)
                document.getElementById('messages').textContent = 'Failed to load messages.'
            }
        }

        setInterval(updateMessages, 1000)
        updateMessages()

        document.getElementById('messageInput').addEventListener('keypress', async function(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('messageInput')
                const text = input.value.trim()
                if (!text) return

                const currentName = displayName || prompt('Enter display name:') || ''
                if (currentName) {
                    saveStoredName(currentName)
                }

                try {
                    const response = await fetch('/api/message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: currentName, text })
                    })
                    if (!response.ok) throw new Error('Failed to send message')
                    input.value = ''
                    updateMessages()
                } catch (err) {
                    console.error('Failed to send message', err)
                    document.getElementById('messages').textContent = 'Failed to send message.'
                }
            }
        })
    </script>
</body>
</html>
